<!doctype html>
<meta charset="utf-8">
<title>Engine preview</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px system-ui}#g{display:grid;grid-template-columns:repeat(auto-fill,480px);gap:6px;padding:6px}figure{margin:0}figcaption{padding:2px 0}canvas{display:block;width:480px;height:270px;background:#000}</style>
<div id="g"></div>
<script type="module">
// Renders every scene of one engine: tools/preview.html?engine=cartoon[&t=10][&frames=30][&scene=id][&w=480&h=270]
import { loadAll, defaultsFor } from '../js/registry.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 480), H = +(q.get('h') || 270), T0 = +(q.get('t') || 12), FR = +(q.get('frames') || 20);
window.__errors = [];
addEventListener('error', e => window.__errors.push(String(e.message)));
const { scenes } = await loadAll(q.get('engine') ? q.get('engine').split(',') : null);
const list = scenes.filter(s => !q.get('scene') || s.id === q.get('scene'));
for (const s of list) {
  const fig = document.createElement('figure'), c = document.createElement('canvas'), cap = document.createElement('figcaption');
  c.width = W; c.height = H; cap.textContent = s.id + ' — ' + s.name; fig.append(c, cap); g.append(fig);
  try {
    const eng = s.engine, ctx = c.getContext(eng.kind === 'gl' ? 'webgl2' : '2d', eng.kind === 'gl' ? { preserveDrawingBuffer: true } : undefined);
    const inst = eng.create(ctx, s.opts || {});
    const p = defaultsFor(eng, s);
    const pointer = { x: 0.5, y: 0.5, down: false, moved: false, dragX: 0, dragY: 0, clicks: [] };
    const t0 = performance.now();
    for (let i = 0; i < FR; i++) inst.render({ ctx, w: W, h: H, t: T0 + i / 30, dt: 1 / 30, clock: T0 + i / 30, p, pointer, opts: s.opts || {} });
    if (eng.kind === "gl") ctx.readPixels(0, 0, 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, new Uint8Array(4)); else ctx.getImageData(0, 0, 1, 1);
    cap.textContent += `  (${((performance.now() - t0) / FR).toFixed(1)} ms/frame)`;
  } catch (err) { cap.textContent += '  ERROR: ' + err.message; cap.style.color = '#f66'; window.__errors.push(s.id + ': ' + err.message); }
}
window.__done = list.length;
</script>
